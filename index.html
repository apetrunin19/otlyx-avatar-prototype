<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>OTLYX Аватар</title><style>
*{box-sizing:border-box;margin:0}body{background:#0b0d12;color:#e8ecf3;font-family:-apple-system,system-ui,sans-serif;max-width:480px;margin:auto;min-height:100vh}
header{padding:14px 18px;display:flex;justify-content:space-between;align-items:center}header b{letter-spacing:4px;font-size:20px;color:#b6ff3b}header small{color:#8a93a6}
#v{width:100%;height:52vh;touch-action:none;position:relative}#stage{position:absolute;top:8px;left:18px;font-weight:700;font-size:18px}
.p{padding:0 18px 18px}.row{margin:10px 0}.row label{display:flex;justify-content:space-between;font-size:14px;color:#aab3c5}
input[type=range]{width:100%;accent-color:#b6ff3b}.bar{height:8px;background:#1d222d;border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:#b6ff3b;transition:.4s}
button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:#b6ff3b;color:#0b0d12;font-weight:800;font-size:16px}
</style></head><body>
<header><b>OTLYX</b><small>Атлетикум</small></header>
<div id="v"><div id="stage"></div></div>
<div class="p"><div class="row"><label><span id="lvl">Уровень 1</span><span id="xpt"></span></label><div class="bar"><i id="xp"></i></div></div>
<div class="row"><label>Сила<span id="sv"></span></label><input type="range" id="s" min="0" max="100" value="10"></div>
<div class="row"><label>Масса<span id="mv"></span></label><input type="range" id="m" min="0" max="100" value="10"></div>
<div class="row"><label>Выносливость<span id="ev"></span></label><input type="range" id="e" min="0" max="100" value="10"></div>
<button id="t">+ тренировка</button></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import*as T from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const v=document.getElementById('v'),R=new T.WebGLRenderer({antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));v.appendChild(R.domElement);
const S=new T.Scene(),C=new T.PerspectiveCamera(35,1,.1,100);C.position.set(0,1.3,5.2);
S.add(new T.HemisphereLight(0xcfe3ff,0x20242c,1.2));const d=new T.DirectionalLight(0xffffff,2);d.position.set(3,5,4);S.add(d);const r=new T.DirectionalLight(0xb6ff3b,1);r.position.set(-3,2,-3);S.add(r);
const fl=new T.Mesh(new T.CircleGeometry(1.2,32),new T.MeshStandardMaterial({color:0x161a22}));fl.rotation.x=-Math.PI/2;S.add(fl);
const O=new OrbitControls(C,R.domElement);O.target.set(0,1,0);O.enablePan=false;O.minDistance=3;O.maxDistance=8;O.enableDamping=true;
const mat=new T.MeshStandardMaterial({color:0xc9a27e,flatShading:true,roughness:.8}),sh=new T.MeshStandardMaterial({color:0x2b3342,flatShading:true}),pn=new T.MeshStandardMaterial({color:0x111318,flatShading:true});
const P=(g,m,p,par)=>{const o=new T.Mesh(g,m);o.position.set(...p);(par||S).add(o);return o};
const ico=r=>new T.IcosahedronGeometry(r,1),cyl=(a,b,h)=>new T.CylinderGeometry(a,b,h,7);
const body=new T.Group();S.add(body);
const hips=P(cyl(.2,.17,.25),pn,[0,.95,0],body);
const torso=new T.Group();torso.position.y=1.08;body.add(torso);
const chest=P(cyl(.24,.17,.5),sh,[0,.3,0],torso);
const head=P(ico(.15),mat,[0,.78,0],torso);head.scale.y=1.2;P(cyl(.06,.07,.1),mat,[0,.6,0],torso);
const arm=s=>{const g=new T.Group();g.position.set(s*.3,.52,0);torso.add(g);const sd=P(ico(.09),sh,[0,0,0],g);const up=P(cyl(.06,.05,.32),mat,[0,-.2,0],g);const lo=P(cyl(.05,.04,.3),mat,[0,-.5,0],g);P(ico(.05),mat,[0,-.68,0],g);g.rotation.z=s*.12;return{g,sd,up,lo}};
const A=[arm(-1),arm(1)];
const leg=s=>{const g=new T.Group();g.position.set(s*.1,.88,0);body.add(g);const th=P(cyl(.09,.065,.42),pn,[0,-.21,0],g);const sh2=P(cyl(.06,.045,.4),mat,[0,-.62,0],g);P(new T.BoxGeometry(.1,.06,.2),pn,[0,-.84,.04],g);return{th,sh2}};
const L=[leg(-1),leg(1)];
const st={s:10,m:10,e:10,xp:0,lvl:1},cur={sh:1,arm:1,ch:1,w:1};let tgt={...cur};
const names=['Худой','Подтянутый','Атлетичный','Мощный'],P4=[{sh:.8,arm:.75,ch:.8,w:.85},{sh:1,arm:1,ch:1,w:.9},{sh:1.2,arm:1.3,ch:1.2,w:.88},{sh:1.4,arm:1.65,ch:1.45,w:1.05}];
const $=i=>document.getElementById(i);
function upd(){const sc=(st.s*.45+st.m*.35+st.e*.2);const i=sc<25?0:sc<50?1:sc<75?2:3;tgt={...P4[i]};
tgt.arm+=(st.s-50)/400;tgt.w+=(st.m-50)/500-(st.e-50)/800;
$('stage').textContent=`Stage ${i+1} – ${names[i]}`;['s','m','e'].forEach(k=>{$(k).value=st[k];$(k+'v').textContent=st[k]});
$('lvl').textContent='Уровень '+st.lvl;$('xpt').textContent=st.xp+' / 100 XP';$('xp').style.width=st.xp+'%'}
['s','m','e'].forEach(k=>$(k).oninput=ev=>{st[k]=+ev.target.value;upd()});
$('t').onclick=()=>{st.xp+=35;if(st.xp>=100){st.xp-=100;st.lvl++}['s','m','e'].forEach(k=>st[k]=Math.min(100,st[k]+3+Math.floor(Math.random()*5)));upd()};
upd();
function rs(){const w=v.clientWidth,h=v.clientHeight;R.setSize(w,h);C.aspect=w/h;C.updateProjectionMatrix()}addEventListener('resize',rs);rs();
const ck=new T.Clock();R.setAnimationLoop(()=>{const t=ck.getElapsedTime();for(const k in cur)cur[k]+=(tgt[k]-cur[k])*.08;
chest.scale.set(cur.ch,1,cur.ch*.85);chest.geometry.parameters;torso.scale.set(1,1+Math.sin(t*2)*.012,1);
A.forEach((a,j)=>{const s=j?1:-1;a.g.position.x=s*.3*cur.sh;a.sd.scale.setScalar(cur.sh);a.up.scale.set(cur.arm,1,cur.arm);a.lo.scale.set((cur.arm+1)/2,1,(cur.arm+1)/2);a.g.rotation.z=s*(.12+(cur.arm-1)*.15)+Math.sin(t*2)*.02*s});
hips.scale.set(cur.w,1,cur.w);L.forEach(l=>{l.th.scale.set((cur.arm+1)/2,1,(cur.arm+1)/2)});
body.rotation.y=Math.sin(t*.5)*.08;head.rotation.y=Math.sin(t*.7)*.2;O.update();R.render(S,C)});
</script></body></html>
